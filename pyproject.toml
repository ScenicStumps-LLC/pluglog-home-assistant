# Tooling only (Home Assistant loads custom_components/pluglog itself; HACS reads hacs.json).
#   pip install pytest-homeassistant-custom-component ruff   (Python 3.13)
#   python -m pytest     ruff check .

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
